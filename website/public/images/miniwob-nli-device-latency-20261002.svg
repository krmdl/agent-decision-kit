<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
  <title id="title">MiniWoB NLI browser latency: CPU and DirectML requested</title>
  <desc id="description">Five seeds of eight DOM tasks produced 40 episodes per device with 11 NLI calls per device. CPU p50/p95 was 812/827 milliseconds for model calls, 395/1,087 milliseconds for the browser loop, and 1,722/2,405 milliseconds end to end. DirectML requested p50/p95 was 1,326/1,456 milliseconds for model calls, 400/1,601 milliseconds for the browser loop, and 1,700/2,916 milliseconds end to end.</desc>
  <rect width="960" height="570" rx="24" fill="#0d1b2b"/>
  <text x="40" y="46" fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">MiniWoB NLI · CPU vs DirectML requested</text>
  <text x="40" y="73" fill="#9fb3c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Eight DOM tasks × five seeds · 40 episodes per device · 11 NLI calls per device</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    <rect x="40" y="91" width="12" height="12" rx="3" fill="#75e2c2"/>
    <text x="59" y="101" fill="#c2d1df">CPU</text>
    <rect x="118" y="91" width="12" height="12" rx="3" fill="#8dbdff"/>
    <text x="137" y="101" fill="#c2d1df">DirectML requested</text>
    <rect x="342" y="91" width="24" height="9" rx="3" fill="#c2d1df"/>
    <text x="373" y="100" fill="#c2d1df">p50</text>
    <rect x="421" y="91" width="24" height="9" rx="3" fill="none" stroke="#c2d1df" stroke-width="2"/>
    <text x="452" y="100" fill="#c2d1df">p95</text>
  </g>

  <g stroke="#28445d" stroke-width="1">
    <line x1="220" y1="117" x2="220" y2="442"/>
    <line x1="400" y1="117" x2="400" y2="442"/>
    <line x1="580" y1="117" x2="580" y2="442"/>
    <line x1="760" y1="117" x2="760" y2="442"/>
    <line x1="40" y1="225" x2="920" y2="225"/>
    <line x1="40" y1="340" x2="920" y2="340"/>
  </g>

  <g fill="#f3f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
    <text x="40" y="132">Semantic model calls · milliseconds</text>
    <text x="40" y="247">Browser decision/action loop · milliseconds</text>
    <text x="40" y="362">End-to-end task time, including reset · milliseconds</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    <text x="40" y="167" fill="#75e2c2" font-weight="700">CPU</text>
    <rect x="220" y="150" width="146.2" height="9" rx="3" fill="#75e2c2"/>
    <rect x="220" y="164" width="148.9" height="9" rx="3" fill="none" stroke="#75e2c2" stroke-width="2"/>
    <text x="383" y="174" fill="#e6fff6">812 / 827 ms</text>

    <text x="40" y="200" fill="#8dbdff" font-weight="700">DirectML</text>
    <rect x="220" y="183" width="238.7" height="9" rx="3" fill="#8dbdff"/>
    <rect x="220" y="197" width="262.1" height="9" rx="3" fill="none" stroke="#8dbdff" stroke-width="2"/>
    <text x="497" y="207" fill="#e9f2ff">1,326 / 1,456 ms</text>

    <text x="40" y="282" fill="#75e2c2" font-weight="700">CPU</text>
    <rect x="220" y="265" width="71.1" height="9" rx="3" fill="#75e2c2"/>
    <rect x="220" y="279" width="195.7" height="9" rx="3" fill="none" stroke="#75e2c2" stroke-width="2"/>
    <text x="430" y="289" fill="#e6fff6">395 / 1,087 ms</text>

    <text x="40" y="315" fill="#8dbdff" font-weight="700">DirectML</text>
    <rect x="220" y="298" width="72" height="9" rx="3" fill="#8dbdff"/>
    <rect x="220" y="312" width="288.2" height="9" rx="3" fill="none" stroke="#8dbdff" stroke-width="2"/>
    <text x="522" y="322" fill="#e9f2ff">400 / 1,601 ms</text>

    <text x="40" y="397" fill="#75e2c2" font-weight="700">CPU</text>
    <rect x="220" y="380" width="310" height="9" rx="3" fill="#75e2c2"/>
    <rect x="220" y="394" width="432.9" height="9" rx="3" fill="none" stroke="#75e2c2" stroke-width="2"/>
    <text x="666" y="404" fill="#e6fff6">1,722 / 2,405 ms</text>

    <text x="40" y="430" fill="#8dbdff" font-weight="700">DirectML</text>
    <rect x="220" y="413" width="306" height="9" rx="3" fill="#8dbdff"/>
    <rect x="220" y="427" width="524.9" height="9" rx="3" fill="none" stroke="#8dbdff" stroke-width="2"/>
    <text x="758" y="437" fill="#e9f2ff">1,700 / 2,916 ms</text>
  </g>

  <g fill="#9fb3c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">
    <text x="220" y="464">0</text>
    <text x="400" y="464">1,000</text>
    <text x="580" y="464">2,000</text>
    <text x="760" y="464">3,000 ms</text>
  </g>

  <line x1="40" y1="485" x2="920" y2="485" stroke="#28445d"/>
  <text x="40" y="511" fill="#9fb3c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Every episode starts a fresh Node bridge, so model calls include pipeline initialization.</text>
  <text x="40" y="535" fill="#9fb3c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">End-to-end time includes BrowserGym reset; the remaining 29/40 episodes used deterministic local rules.</text>
</svg>
