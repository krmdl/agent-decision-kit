<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Browser decision flow</title>
  <desc id="desc">Inspect visible controls, choose one action from a short list, request user approval if it is sensitive, then execute and return the page change.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#75e2c2"/></marker></defs>
  <rect width="1000" height="250" rx="24" fill="#08111f"/>
  <g fill="#0d1b2b" stroke="#29435a" stroke-width="2"><rect x="30" y="76" width="190" height="108" rx="16"/><rect x="285" y="76" width="190" height="108" rx="16"/><rect x="540" y="76" width="190" height="108" rx="16"/><rect x="795" y="76" width="175" height="108" rx="16"/></g>
  <g fill="none" stroke="#75e2c2" stroke-width="3" marker-end="url(#a)"><path d="M220 130h55"/><path d="M475 130h55"/><path d="M730 130h55"/></g>
  <g text-anchor="middle" font-family="Inter,Segoe UI,sans-serif"><text x="125" y="119" fill="#edf3fb" font-size="18" font-weight="700">Inspect</text><text x="125" y="148" fill="#a9bbcd" font-size="13">visible DOM controls</text><text x="380" y="119" fill="#edf3fb" font-size="18" font-weight="700">Choose</text><text x="380" y="148" fill="#a9bbcd" font-size="13">one bounded action</text><text x="635" y="119" fill="#edf3fb" font-size="18" font-weight="700">Approve</text><text x="635" y="148" fill="#a9bbcd" font-size="13">only when sensitive</text><text x="882" y="119" fill="#edf3fb" font-size="18" font-weight="700">Act + diff</text><text x="882" y="148" fill="#a9bbcd" font-size="13">execute, return delta</text></g>
</svg>
