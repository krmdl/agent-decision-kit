<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Agent Decision Kit architecture</title>
  <desc id="desc">A coding agent sends a bounded request to a local MCP server, which inspects local state, asks a decision provider, validates a typed result, and lets ordinary code take an action. Consequential browser actions have a separate user approval gate.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75e2c2"/><stop offset="1" stop-color="#8dbdff"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#75e2c2"/></marker>
  </defs>
  <rect width="1200" height="500" rx="30" fill="#08111f"/>
  <g fill="#0d1b2b" stroke="#29435a" stroke-width="2">
    <rect x="45" y="167" width="190" height="132" rx="18"/>
    <rect x="295" y="167" width="205" height="132" rx="18"/>
    <rect x="560" y="77" width="205" height="132" rx="18"/>
    <rect x="560" y="291" width="205" height="132" rx="18"/>
    <rect x="830" y="167" width="175" height="132" rx="18"/>
    <rect x="1040" y="167" width="125" height="132" rx="18"/>
  </g>
  <g fill="none" stroke="#75e2c2" stroke-width="3" marker-end="url(#arrow)">
    <path d="M235 233h54"/><path d="M500 210 550 153"/><path d="M500 257 550 355"/><path d="M765 153 820 210"/><path d="M765 355 820 257"/><path d="M1005 233h26"/>
  </g>
  <g fill="#edf3fb" font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <text x="140" y="216" font-size="20" font-weight="700">Coding agent</text><text x="140" y="246" font-size="14" fill="#a9bbcd">MCP client</text><text x="140" y="270" font-size="13" fill="#75e2c2">bounded task</text>
    <text x="397" y="216" font-size="20" font-weight="700">Local tools</text><text x="397" y="246" font-size="14" fill="#a9bbcd">Playwright · code · CLI</text><text x="397" y="270" font-size="13" fill="#75e2c2">limited context</text>
    <text x="662" y="126" font-size="19" font-weight="700">Decision provider</text><text x="662" y="156" font-size="14" fill="#a9bbcd">local by default</text><text x="662" y="180" font-size="13" fill="#8dbdff">optional remote adapters</text>
    <text x="662" y="342" font-size="19" font-weight="700">User approval</text><text x="662" y="372" font-size="14" fill="#a9bbcd">separate confirmation</text><text x="662" y="396" font-size="13" fill="#ffb4b4">sensitive browser actions</text>
    <text x="917" y="216" font-size="20" font-weight="700">Validate</text><text x="917" y="246" font-size="14" fill="#a9bbcd">typed answer</text><text x="917" y="270" font-size="13" fill="#75e2c2">visible confidence source</text>
    <text x="1102" y="220" font-size="17" font-weight="700">Execute</text><text x="1102" y="249" font-size="13" fill="#a9bbcd">code only</text><text x="1102" y="272" font-size="13" fill="#75e2c2">return delta</text>
  </g>
  <text x="600" y="52" text-anchor="middle" fill="#75e2c2" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="800" letter-spacing="3">A SMALL DECISION LOOP WITH EXPLICIT BOUNDARIES</text>
</svg>
