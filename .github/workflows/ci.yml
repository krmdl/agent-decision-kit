name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run hook:verify
      - run: npm run agents:verify
      - run: npm --prefix website ci
      - run: npm --prefix website audit --audit-level=high
      - run: npm run website:verify
        env:
          SITE_URL: https://krmdl.github.io/agent-decision-kit/
